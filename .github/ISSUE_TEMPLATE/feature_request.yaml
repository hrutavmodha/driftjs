name: "Feature Request"
description: Propose a new feature, RFC, directive, opcode, or improvement for DriftJS.
title: "[FEAT]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape the future of **DriftJS**!
        Before proposing a feature, please search [existing open feature requests](https://github.com/hrutavmodha/driftjs/issues?q=is%3Aopen+is%3Aissue+label%3Aenhancement) and [discussions](https://github.com/hrutavmodha/driftjs/discussions) to see if a similar RFC or feature proposal already exists.

  - type: dropdown
    id: package
    attributes:
      label: Target Package / Subsystem
      description: Select the DriftJS package or subsystem this feature proposal applies to.
      options:
        - "driftjs-compiler (Compiler Pipeline: Lexer, Parser, Transformer, Bytecode Generator)"
        - "driftjs-dom (Client VM, Reconciler, Keyed Lists, Hydration, Event System)"
        - "driftjs-ssr (DriftServerVM, Server-Side Rendering, HTML Streaming)"
        - "driftjs-shared (Scope Engine, Expression Evaluation, AST Execution)"
        - "driftjs-vite-plugin (Vite Plugin, AOT Build Optimizations, HMR)"
        - "create-drift (CLI Scaffolding Tool, Templates & Presets)"
        - "driftjs-vscode (Language Server Protocol, Syntax Highlighting, Formatting, Tooling)"
        - "Instruction Set Architecture (ISA Opcodes & Bytecode Format)"
        - "Documentation, Benchmarks & Examples"
        - "Other / General Architecture"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary & Motivation
      description: What problem does this feature solve? Provide a clear and concise summary of the proposed enhancement.
      placeholder: "Describe the use case, why this is needed, and how it benefits DriftJS developers."
    validations:
      required: true

  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed Syntax / API / Architecture Design
      description: Provide concrete examples of proposed `.drift` syntax, compiler output, or runtime API changes.
      placeholder: |
        <!-- Example .drift SFC syntax or API usage -->
        <script>
          let { title, items = [] } = props;
          let activeIndex = 0;
        </script>

        <div class="list-container">
          <h2>{title}</h2>
          <ul>
            @for (item, index) in items {
              <li class={index === activeIndex ? "active" : ""}>
                {item.name}
              </li>
            }
          </ul>
        </div>
      render: html
    validations:
      required: true

  - type: textarea
    id: compiler-runtime-impact
    attributes:
      label: Compiler & Runtime Impact
      description: Does this require new AST nodes, new bytecode opcodes (in Opcode enum), modifications to the Transformer, or Reconciler updates?
      placeholder: "Describe any required changes to Opcode definitions, AST nodes, DriftTransformer, or DriftClientVM execution."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative approaches, APIs, or workarounds you considered and why they were not chosen.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, benchmarks, comparisons to other frameworks, or design mockups.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions to ensure this feature request is not a duplicate.
          required: true
        - label: I have provided concrete code/syntax examples and detailed the rationale.
          required: true
        - label: I have considered the performance implications and alignment with DriftJS zero-proxy / VM design philosophy.
          required: false
