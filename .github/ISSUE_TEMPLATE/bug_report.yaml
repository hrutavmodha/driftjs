name: "Bug Report"
description: Report an issue in the DriftJS compiler, register VM runtime, Vite plugin, CLI, or VSCode extension.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **DriftJS**!
        Before submitting, please search [existing open issues](https://github.com/hrutavmodha/driftjs/issues) to ensure your problem hasn't already been reported.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Select the area or subsystem where the issue occurs.
      options:
        - "Template Compiler & Bytecode Generator"
        - "Browser VM & DOM Runtime"
        - "Server-Side Rendering (SSR)"
        - "Vite Plugin & Build Integration"
        - "CLI Scaffolding Tool"
        - "VS Code Extension & Language Server"
        - "Starter Project Template"
        - "Documentation & Examples"
        - "Other / General"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DriftJS Version
      description: Version of DriftJS packages in use.
      placeholder: "0.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is, what happened, and what you expected to happen instead.
      placeholder: "Describe what happened and what you expected instead."
    validations:
      required: true

  - type: textarea
    id: code-snippet
    attributes:
      label: Minimal .drift Component or Code Snippet
      description: Provide a minimal `.drift` Single File Component or JS snippet that reproduces the issue.
      placeholder: |
        <script>
          let count = 0;
          function increment() {
            count++;
          }
        </script>

        <div>
          <button onclick={increment}>Count: {count}</button>
        </div>
      render: html
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Create a component with ...
        2. Run `pnpm dev` or `pnpm build`
        3. See compiler error / runtime panic ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Trace
      description: Paste any compiler error output, Vitest failure trace, or browser console errors.
      render: shell
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node.js version, package manager, OS, and browser (if applicable).
      placeholder: "Node v20.11.0, pnpm v10.18.2, Linux x64, Chrome 128"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any extra details, suspected ISA opcode issues, VM register behavior, or potential fixes.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have verified this issue is not already reported in existing open issues.
          required: true
        - label: I have provided clear steps and minimal code to reproduce the issue.
          required: true
